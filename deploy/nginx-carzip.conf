# nginx in front of CarZip. Replace every "example.com" with your domain, then:
#   sudo cp deploy/nginx-carzip.conf /etc/nginx/sites-available/carzip
#   sudo ln -s /etc/nginx/sites-available/carzip /etc/nginx/sites-enabled/carzip
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com -d api.example.com   (free HTTPS, renews by itself)
# The API runs with TRUST_PROXY=1 because exactly this one proxy stands in front of it.

# the website: example.com and www.example.com -> Next.js on port 3000
server {
	listen 80;
	server_name example.com www.example.com;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

# the API: api.example.com -> NestJS on port 3007 (GraphQL, photo uploads and files, live chat WebSocket)
server {
	listen 80;
	server_name api.example.com;

	# up to 20 photos of 10 MB in one upload (the API checks the real limits)
	client_max_body_size 210m;

	location / {
		proxy_pass http://127.0.0.1:3007;
		proxy_http_version 1.1;
		# the live chat is a WebSocket: let the connection upgrade, and keep quiet chats open
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 1h;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

# "Connection: upgrade" only for WebSocket requests
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}
